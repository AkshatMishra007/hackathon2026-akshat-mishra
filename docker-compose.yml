version: "3.9"

services:
  db:
    image: postgres:16
    container_name: support_agent_db
    environment:
      POSTGRES_DB: support_db
      POSTGRES_USER: support_user
      POSTGRES_PASSWORD: support_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_user -d support_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: .
    container_name: support_agent_web
    depends_on:
      db:
        condition: service_healthy   # ← this is the key fix
    environment:
      DATABASE_URL: postgresql://support_user:support_pass@db:5432/support_db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
